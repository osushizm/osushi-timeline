# 積読リストは now.yaml に静的なitemsを持たず、
# 「tsundoku」ラベルが付いたopenなIssueから毎回のビルド時に取得して表示する。
# そのため、このワークフローはIssueの開閉・編集に応じてCloudflare Pagesの
# 再ビルドをトリガーするだけでよい(Issueをcloseすれば一覧から消える)。
name: tsundoku-rebuild
on:
  issues:
    types: [opened, closed, reopened, edited]
jobs:
  rebuild:
    if: contains(github.event.issue.labels.*.name, 'tsundoku')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}" ]; then
            curl -sf -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
          else
            echo "CLOUDFLARE_DEPLOY_HOOK が未設定です"
          fi
