# 積読リストは now.yaml に静的なitemsを持たず、
# 「tsundoku」ラベルが付いたopenなIssueから毎回のビルド時に取得して表示する。
# そのため、このワークフローはIssueの開閉・編集に応じてCloudflare Pagesの
# 再ビルドをトリガーするだけでよい(Issueをcloseすれば一覧から消える)。
name: tsundoku-rebuild
on:
  issues:
    types: [opened, closed, reopened, edited]
jobs:
  rebuild:
    # tsundokuラベルに加え、テンプレートの固定タイトル接頭辞「[積読]」でも判定する。
    # (ラベルはリポジトリに事前作成されていないとIssueフォームから自動付与されないため)
    if: contains(github.event.issue.labels.*.name, 'tsundoku') || startsWith(github.event.issue.title, '[積読]')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        run: |
          HOOK="${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK が未設定です"
            exit 0
          fi
          echo "HOOK length: ${#HOOK}"
          case "$HOOK" in
            https://*) ;;
            *)
              echo "::error::CLOUDFLARE_DEPLOY_HOOK が https:// で始まっていません。前後に空白・改行・引用符が混ざっていないか、Settings > Secrets and variables > Actions で値を確認・再登録してください。"
              exit 1
              ;;
          esac
          curl -sf -X POST "$HOOK"
