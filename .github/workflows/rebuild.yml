# 毎日早朝にCloudflare Pagesを再ビルドして「今月」の表示などを追従させる
# リポジトリの Settings > Secrets に CLOUDFLARE_DEPLOY_HOOK を登録すること
name: daily-rebuild
on:
  schedule:
    - cron: '17 19 * * *'   # 19:17 UTC = 4:17 JST
  workflow_dispatch: {}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        run: |
          HOOK="${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK が未設定です"
            exit 0
          fi
          echo "HOOK length: ${#HOOK}"
          case "$HOOK" in
            https://*) ;;
            *)
              echo "::error::CLOUDFLARE_DEPLOY_HOOK が https:// で始まっていません。前後に空白・改行・引用符が混ざっていないか、Settings > Secrets and variables > Actions で値を確認・再登録してください。"
              exit 1
              ;;
          esac
          curl -sf -X POST "$HOOK"
