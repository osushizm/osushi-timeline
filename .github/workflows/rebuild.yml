# 毎日早朝にCloudflare Pagesを再ビルドして「今月」の表示などを追従させる
# リポジトリの Settings > Secrets に CLOUDFLARE_DEPLOY_HOOK を登録すること
name: daily-rebuild
on:
  schedule:
    - cron: '17 19 * * *'   # 19:17 UTC = 4:17 JST
  workflow_dispatch: {}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}" ]; then
            curl -sf -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
          else
            echo "CLOUDFLARE_DEPLOY_HOOK が未設定です"
          fi
